name: ci

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Build + unit tests on the same stack a Linux packager would use.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

  # Build a self-contained Windows folder: exe + windeployqt output.
  # Every push produces an inspectable artifact; a v* tag attaches the zip
  # to its GitHub release.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt runtime
        shell: msys2 {0}
        run: |
          mkdir dist
          cp build/DiceSimulatorQt.exe dist/
          windeployqt --release --no-translations dist/DiceSimulatorQt.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -Destination "DiceSimulatorQt-win64-${{ github.ref_name }}.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DiceSimulatorQt-win64-*.zip
